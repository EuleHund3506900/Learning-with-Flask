<!DOCTYPE html>

<head>
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='tabler-icons-300.min.css') }}">
    {% block head %} {% endblock %}
</head>

<body>
    <nav class="main-nav">
        <h1>Learning</h1>
        <a href="{{ url_for('app.home') }}"><i class="ti ti-home"></i></a>
        <a href="{{ url_for('app.courses') }}">Kurse</a>
    </nav>
    <section class="content">
        <header>
            {% block header %}{% endblock %}
        </header>
        {% for message in get_flashed_messages() %}
        <div class="flash">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </section>
</body>

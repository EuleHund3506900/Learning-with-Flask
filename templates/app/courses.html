{% extends 'main.html' %}

{% block header %}
  <h2 class="courses-header">{% block title %}Alle Kurse{% endblock %}</h2>
{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='courses.css') }}">
{% endblock %}

{% block content %}
  <div class="courses-list-container" aria-label="Kursübersicht">
    {% for name in folder_information["names"] %}
      <a href="{{ url_for('app.folder', folderpath=folder_information['paths'][loop.index0]) }}" class="course-item">
        <div class="course-item-content">
          <span class="course-badge">Kurs</span>
          <h3>{{ name }}</h3>
        </div>
        <i class="ti ti-chevron-right" aria-hidden="true"></i>
      </a>
    {% endfor %}
  </div>
{% endblock %}

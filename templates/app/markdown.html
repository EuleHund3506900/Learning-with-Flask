{% extends 'main.html' %}

{% block title %}{{ file_name }}{% endblock %}


{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='github-css.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='lesson.css') }}">
{% endblock %}

{% block content %}
<div class="lesson-header">
  <h2 class="lesson-title">{{ file_name.replace(".md", "") }}</h2>
  <div>
    <button class="ghost reset-button hidden"><i class="ti ti-reload"></i> Fortschritt zurücksetzen</button>
    <button class="outline" onClick="window.history.back()">Zurück</button>
    
    {% if show_navigation %}
      <button class="full">Weiter</button>
    {% endif %}
  </div>
</div>
<div class="markdown-limiter">
  {{ markdown|safe }}
</div>
<div class="lesson-footer">
  <div></div>
  <div>
    <button class="ghost"><i class="ti ti-star"></i>  Favorit</button>
    <button class="full"><i class="ti ti-check"></i>  Abschließen</button>
    {% if show_navigation %}
      <button class="full">Weiter</button>
    {% endif %}
  </div>
</div>
<script src="{{ url_for('static', filename='scripts/lesson.js') }}"></script>
{% endblock %}
